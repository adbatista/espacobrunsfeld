# Configurações do site (Jekyll)
title: "Espaço Brunsfeld"
description: "Fisioterapia, osteopatia e pilates clínico em Guarapuava - PR. Atendimento personalizado com base em evidências científicas."
lang: pt-BR
# Se publicar em https://usuario.github.io/espacobrunsfeld, deixe baseurl: "/espacobrunsfeld".
# Com domínio próprio (ex.: espacobrunsfeld.com.br), use baseurl: ""
baseurl: ""
url: ""
# Faixa amarela de aviso de conteúdo provisório. Mude para false quando o conteúdo real estiver no lugar.
aviso_modelo: false
# Cada arquivo em _servicos/ vira uma página em /servico/<nome>/ e um card em Serviços
collections:
  servicos:
    output: true
    permalink: /servico/:name/
servicos_por_pagina: 6
defaults:
  - scope:
      type: servicos
    values:
      layout: servico
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - docs
  - vendor
