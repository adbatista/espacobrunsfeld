name: Baixar fotos do site original (temporário)

on:
  push:
    branches: [fotos-originais]

permissions:
  contents: write

jobs:
  baixar:
    if: "!contains(github.event.head_commit.message, '[fotos]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar páginas e imagens
        run: |
          set -u
          mkdir -p /tmp/paginas original
          BASE=https://espacobrunsfeld.com.br
          for p in "/" "/sobre/" "/servicos/" "/servicos/?pagina=2" "/servicos/?pagina=3" "/cursos/" "/contato/"; do
            f=/tmp/paginas/$(echo "$p" | tr -c 'a-z0-9' '_').html
            curl -sSL -A "Mozilla/5.0" "$BASE$p" -o "$f" || true
          done
          # páginas de cada serviço
          grep -hoE "post_type=servico&(amp;)?p=[0-9]+" /tmp/paginas/*.html | grep -oE '[0-9]+$' | sort -u | while read id; do
            curl -sSL -A "Mozilla/5.0" "$BASE/?post_type=servico&p=$id" -o /tmp/paginas/servico_$id.html || true
          done
          # CSS do tema (pode ter imagens de fundo)
          grep -hoE 'href="[^"]+\.css[^"]*"' /tmp/paginas/*.html | sed 's/href="//;s/"$//' | sort -u > /tmp/css.txt
          i=0; while read u; do i=$((i+1)); curl -sSL -A "Mozilla/5.0" "$(echo "$u" | sed "s#^/#$BASE/#")" -o /tmp/paginas/estilo_$i.css || true; done < /tmp/css.txt
          grep -hoE "(https?://[a-z.]*espacobrunsfeld\.com\.br)?/?content/(uploads|themes)/[^\"' )>]+\.(png|jpe?g|webp|gif|svg)" /tmp/paginas/* \
            | sed -E "s#^https?://[a-z.]*espacobrunsfeld\.com\.br##; s#^([^/])#/\1#" | sort -u > /tmp/imagens.txt
          wc -l /tmp/imagens.txt
          while read p; do
            dest="original${p#/content}"
            mkdir -p "$(dirname "$dest")"
            curl -sSL -A "Mozilla/5.0" --fail "$BASE$p" -o "$dest" || rm -f "$dest"
          done < /tmp/imagens.txt
          # guarda a lista e as páginas para consulta de qual imagem vai onde
          mkdir -p original/_referencia
          cp /tmp/imagens.txt original/_referencia/imagens.txt
          cp /tmp/paginas/*.html original/_referencia/ 2>/dev/null || true
          find original -type f | head -200
      - name: Salvar na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add original
          git commit -q -m "[fotos] Imagens baixadas do site original" && git push || echo "nada novo"
